[workspace]
members = ["crates/core", "apps/tv", "apps/desktop"]
# The desktop app builds only on the desktop: left out of the commands of
# the TV (`cargo zigbuild --target armv7…`) and of a plain `cargo test`;
# `-p mana-desktop` or `--workspace` take it.
default-members = ["crates/core", "apps/tv"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
# Symbols kept: the TV package checks the binary's floats with them, then
# strips it (tools/webos/floats.py).
strip = false

# Rune's own patches at the pinned revision: Cargo applies a dependency's
# patches only from the workspace root.
[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "02042d8e7cf1dea94eb3e84879b228e8de6b8324" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "02042d8e7cf1dea94eb3e84879b228e8de6b8324" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "02042d8e7cf1dea94eb3e84879b228e8de6b8324" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "02042d8e7cf1dea94eb3e84879b228e8de6b8324" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "02042d8e7cf1dea94eb3e84879b228e8de6b8324" }
sctk-adwaita = { git = "https://github.com/anomalyco/rune", rev = "02042d8e7cf1dea94eb3e84879b228e8de6b8324" }
accesskit_atspi_common = { git = "https://github.com/anomalyco/rune", rev = "02042d8e7cf1dea94eb3e84879b228e8de6b8324" }
naga = { git = "https://github.com/anomalyco/rune", rev = "02042d8e7cf1dea94eb3e84879b228e8de6b8324" }
