[package]
name = "mana-desktop"
version = "0.1.0"
description = "Mana on the desktop: the channel list and its sources, played by a backend that decodes in software"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "mana-desktop"
path = "src/main.rs"

[dependencies]
cpal = "0.18.2"
mana-core = { path = "../../crates/core", features = ["decoder"] }
# Pinned: Rune is a pre-release (docs/architecture.md, desktop client).
rune = { git = "https://github.com/anomalyco/rune", rev = "02042d8e7cf1dea94eb3e84879b228e8de6b8324", features = ["tooling"] }
url = "2"
