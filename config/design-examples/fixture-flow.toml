# Esempio di linguaggio proposto, non supportato da source.schema.json v1.
# Operazioni e template illustrano il disegno: non sono eseguibili dal player.
format_review = 1
id = "fixture-flow"
enabled = false

[parameters]
base_url = "http://127.0.0.1:8781"

[http_profiles.app]
# User-Agent richiesto dal catalogo del laboratorio sintetico.
User-Agent = "StreamLab/1"

[flows.catalogue]
output = "events.items"
[[flows.catalogue.steps]]
id = "catalogue"
op = "http.json"
version = 1
url = "{parameters.base_url}/catalogue.json"
http_profile = "app"

[[flows.catalogue.steps]]
id = "events"
op = "items.map"
version = 1
input = "catalogue.document"
items_pointer = ""
fields = { id = "/id", title = "/title" }

[flows.sources]
output = "signals.items"
[[flows.sources.steps]]
id = "detail"
op = "http.json"
version = 1
url = "{parameters.base_url}/events/{input.item.id}.json"
path_encoding = "component_once"
http_profile = "app"

[[flows.sources.steps]]
id = "signals"
op = "items.map"
version = 1
input = "detail.document"
items_pointer = "/signals"
fields = { id = "/id", label = "/label", play_type = "/play_type", url = "/url" }

[flows.resolve]
output = "stream.result"
[[flows.resolve.steps]]
id = "stream"
op = "resolver.dispatch"
version = 1
input = "input.candidate"
resolver_set = "fixture_players"

# La selezione dei rami è una lista ordinata. I passaggi complessi rimangono
# in ricette nominate, così il file non diventa un albero di if annidati.
[resolver_sets.fixture_players]
on_unknown = "unsupported_host"
[[resolver_sets.fixture_players.routes]]
when = { play_type = "m3u8" }
use = "direct-hls@1"

[[resolver_sets.fixture_players.routes]]
when = { play_type = "iframe", host = "127.0.0.1" }
use = "synthetic-envelope@1"
