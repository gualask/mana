# The catalogue's entries need a `title`, also when a recipe makes each one
# with `record`.
id = "rejected"
name = "A case to reject"

[[catalogue.steps]]
id = "page"
op = "http"
url = "http://127.0.0.1:8781/catalogue.json"

[[catalogue.steps]]
id = "events"
op = "list.map"
list = "{page.json}"
call = "event"
input = { entry = "{item}" }

[recipes.event]
inputs = ["entry"]

[[recipes.event.steps]]
id = "event"
op = "record"
fields = { id = "{input.entry.id}" }

[[resolve.steps]]
id = "stream"
op = "stream"
url = "http://127.0.0.1:8783/public/master.m3u8"
