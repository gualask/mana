# The catalogue has no item as input.
id = "rejected"
name = "A case to reject"

[[catalogue.steps]]
id = "page"
op = "http"
url = "http://127.0.0.1:8781/events/{input.item.id}.json"

[[catalogue.steps]]
id = "events"
op = "list.map"
list = "{page.json}"
item = { id = "{item.id}", title = "{item.title}" }

[[resolve.steps]]
id = "stream"
op = "stream"
url = "http://127.0.0.1:8783/public/master.m3u8"
