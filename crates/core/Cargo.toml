[package]
name = "mana-core"
version = "0.1.0"
description = "Mana's shared core: live sources, playback through a decoder port, viewing sessions"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aes = "0.8"
aes-gcm = "0.10"
base64 = "0.22"
cbc = "0.1"
ctr = "0.9"
fluent-bundle = "0.16"
getrandom = "0.2"
lol_html = "3.0.3"
md-5 = "0.10"
regex = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
serde_json = "1"
toml = { version = "=1.2.1", default-features = false, features = ["parse", "serde", "std"] }
ureq = { version = "2", default-features = false, features = ["gzip", "tls"] }
url = "2"
webpki-roots = "0.26"

[features]
# Software decoding for a backend without a decoder of its own: the desktop.
decoder = []

[build-dependencies]
cc = "1.11.2"
